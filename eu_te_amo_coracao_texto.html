<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eu te amo ❤️</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    width: 100vw;
    height: 100vh;
    display: block;
  }
</style>
</head>
<body>
<canvas id="heart"></canvas>

<script>
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.addEventListener("resize", resize);
resize();

let progress = 0;

function draw() {
  const w = innerWidth;
  const h = innerHeight;

  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, w, h);

  const scale = Math.min(w, h) / 40;
  const cx = w / 2;
  const cy = h / 2 + scale * 1.0;

  // Mesmo formato matemático do coração do código da imagem.
  for (let layer = 11; layer <= 17; layer++) {
    for (let i = 0; i < 120; i++) {
      const angle = (i * Math.PI * 2) / 120;

      const x0 = 16 * Math.pow(Math.sin(angle), 3);
      const y0 =
        13 * Math.cos(angle) -
        5 * Math.cos(2 * angle) -
        2 * Math.cos(3 * angle) -
        Math.cos(4 * angle);

      const x = cx + x0 * scale * (layer / 14);
      const y = cy - y0 * scale * (layer / 14);

      const hue = 350 + Math.sin(i * 0.25) * 8;
      const alpha = 0.45 + (layer - 11) * 0.035;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-0.10 + Math.sin(i * 0.7 + progress) * 0.05);

      ctx.font = "bold 8px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = `hsla(${hue}, 80%, 84%, ${alpha})`;
      ctx.shadowColor = "rgba(255, 150, 190, .45)";
      ctx.shadowBlur = 3;

      ctx.fillText("Eu te amo", 0, 0);
      ctx.restore();
    }
  }

  // Pequenas palavras extras no centro, como no efeito do vídeo.
  ctx.textAlign = "center";
  ctx.font = "bold 15px Arial";
  ctx.fillStyle = "rgba(255, 190, 215, .9)";
  ctx.fillText("EU TE AMO ❤️", cx, cy + scale * 0.8);

  progress += 0.025;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
